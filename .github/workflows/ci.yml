# ─────────────────────────────────────────────────────────────────
# CI Pipeline — runs on every push and PR to main/develop
#
# Jobs:
#   backend-tests  → lint + pytest
#   frontend-tests → eslint + vitest
#   build-check    → docker build (no push, just validates)
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ──────────────────────────────────────────────────
  backend-tests:
    name: Backend (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check app/ tests/

      - name: Check imports (isort)
        run: isort --check-only app/ tests/

      - name: Lint (flake8)
        run: flake8 app/ tests/ --max-line-length=88

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Frontend ─────────────────────────────────────────────────
  frontend-tests:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test -- --run

  # ── Build check ──────────────────────────────────────────────
  build-check:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t market-prophet-backend ./backend

      - name: Build frontend image
        run: docker build -t market-prophet-frontend ./frontend
